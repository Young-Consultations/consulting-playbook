name: Codex authentication preflight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: codex-auth-preflight
  cancel-in-progress: false

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: consulting-playbook-codex
    steps:
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.63.0
      - name: Verify Codex authentication and provider readiness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          report() {
            local outcome="$1" stage="$2" code="$3" category="$4"
            {
              echo "### Codex authentication preflight"
              echo "- Outcome: ${outcome}"
              echo "- Stage: ${stage}"
              echo "- Exit code: ${code}"
              echo "- Category: ${category}"
              echo "- Client: Codex CLI 0.63.0"
              echo "- Run ID: ${GITHUB_RUN_ID}"
              echo "- Detail: provider output withheld; category is a diagnostic hint, not proof of root cause."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::run_id=${GITHUB_RUN_ID}; stage=${stage}; exit_code=${code}; category=${category}"
          }

          codex_home="${RUNNER_TEMP}/codex-auth-preflight"
          preflight_log="${RUNNER_TEMP}/codex-auth-preflight.log"
          cleanup() {
            rm -rf -- "$codex_home"
            rm -f -- "$preflight_log"
          }
          trap cleanup EXIT

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            report failed credential-check 1 missing-credential
            echo "::error title=Codex preflight failed::category=missing-credential"
            exit 1
          fi

          install -d -m 700 "$codex_home"
          export CODEX_HOME="$codex_home"
          stage="login"
          echo "::notice::stage=login; state=started"
          set +e
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key \
            >"$preflight_log" 2>&1
          exit_code=$?
          # Do not leave the raw secret available to the probe or diagnostic
          # subprocesses, including when login fails.
          unset OPENAI_API_KEY
          if [[ "$exit_code" -eq 0 ]]; then
            report passed login 0 credential-stored
            stage="probe"
            echo "::notice::stage=probe; state=started"
            # Classify only this stage, not earlier successful login output.
            codex exec \
              --color never \
              --sandbox read-only \
              --skip-git-repo-check \
              "Do not use tools. Reply with AUTHENTICATED only." \
              >"$preflight_log" 2>&1
            exit_code=$?
          fi
          set -e

          if [[ "$exit_code" -eq 0 ]]; then
            report passed probe 0 authenticated
            echo "::notice title=Codex preflight passed::Authentication and a read-only provider probe succeeded."
            exit 0
          fi

          if [[ "$exit_code" -eq 127 ]]; then
            category="client-unavailable"
          elif grep -Eqi 'unexpected argument|unrecognized (option|argument)|unknown (option|argument)|invalid value' "$preflight_log"; then
            category="cli-arguments"
          elif grep -Eqi 'failed to (load|parse).*config|error (loading|parsing).*config|TOML parse error' "$preflight_log"; then
            category="client-configuration"
          elif grep -Eqi 'sandbox|landlock|bwrap|operation not permitted' "$preflight_log"; then
            category="sandbox"
          elif grep -Eqi '(^|[^0-9])401([^0-9]|$)|unauthorized|invalid[ _-]?(api[ _-]?)?key|incorrect[ _-]?(api[ _-]?)?key|authentication[_ -]error' "$preflight_log"; then
            category="authentication"
          elif grep -Eqi '(^|[^0-9])403([^0-9]|$)|forbidden|permission[_-]denied|model[_ -]not[_ -]found|model.{0,80}(not found|does not exist|not supported|access|permission)' "$preflight_log"; then
            category="authorization-or-model-access"
          elif grep -Eqi 'insufficient[_ -]?quota|billing|credit|spend[ _-]?limit' "$preflight_log"; then
            category="quota"
          elif grep -Eqi '(^|[^0-9])429([^0-9]|$)|rate[ _-]?limit|too many requests' "$preflight_log"; then
            category="rate-limit"
          elif grep -Eqi 'timed? out|timeout|connection|connect error|dns|network|tls|certificate' "$preflight_log"; then
            category="transport"
          elif grep -Eqi '(^|[^0-9])(500|502|503|504)([^0-9]|$)|internal server error|service unavailable' "$preflight_log"; then
            category="provider-service"
          elif grep -Eqi 'permission denied|read-only file system|no space left|no such file or directory' "$preflight_log"; then
            category="local-filesystem"
          else
            category="codex-runtime"
          fi

          report failed "$stage" "$exit_code" "$category"
          echo "::error title=Codex preflight failed::stage=${stage}; exit_code=${exit_code}; category=${category}; provider output withheld"
          exit "$exit_code"
