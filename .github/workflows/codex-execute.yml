name: Execute admitted consulting-playbook task

on:
  workflow_dispatch:
    inputs:
      execution_input_json:
        description: Complete canonical execution-input/v2 JSON string (serialized JSON, not an object).
        required: true
        type: string
      concurrency_group:
        description: Transport concurrency identity; must exactly match the canonical payload.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: consulting-playbook-codex
    outputs:
      execution_result: ${{ steps.execute.outputs.execution_result }}
      source_issue: ${{ steps.execute.outputs.source_issue }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: executor-binding
        name: Verify registry-bound executor before importing target code
        env:
          GH_TOKEN: ${{ github.token }}
          # Protected environment policy, never a dispatch input or target file.
          CONTROL_PLANE_SHA: ${{ vars.CODEX_AUTHORIZED_CONTROL_PLANE_SHA }}
          OBSERVED_WORKFLOW_REF: ${{ github.workflow_ref }}
          OBSERVED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import re
          import subprocess

          def exact(value):
              return isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value) is not None

          control = os.environ.get("CONTROL_PLANE_SHA", "")
          if not exact(control):
              raise SystemExit("Missing immutable authorized control-plane binding")
          raw = subprocess.check_output([
              "gh", "api", "repos/Young-Consultations/.github/contents/config/codex-repositories.json?ref=" + control,
          ], text=True, timeout=30)
          response = json.loads(raw)
          registry = json.loads(base64.b64decode(response["content"], validate=False))
          entry = registry["repositories"]["Young-Consultations/consulting-playbook"]
          expected = entry["conformance"]["adapter_commit_sha"]
          workflow = entry["workflow_ref"]
          prefix = "Young-Consultations/consulting-playbook/.github/workflows/codex-execute.yml@"
          if (registry.get("registry_format_version") != 1 or not exact(expected)
                  or not workflow.startswith(prefix + "codex-adapter-v")
                  or entry["conformance"].get("status") != "pass"
                  or workflow != prefix + entry["conformance"]["adapter_ref"]
                  or os.environ.get("OBSERVED_WORKFLOW_REF") != workflow
                  or os.environ.get("OBSERVED_WORKFLOW_SHA") != expected):
              raise SystemExit("Workflow is outside the authorized immutable adapter release")
          observed = subprocess.check_output(["git", "rev-parse", "--verify", "HEAD"], text=True, timeout=10).strip()
          if observed != expected:
              raise SystemExit("Executor checkout differs from the registered adapter release")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"executor_sha={expected}\n")
          PYTHON
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema[format]==4.26.0'
      - id: result-source
        name: Authorize request and bind result-writer source
        shell: bash
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
          CONCURRENCY_GROUP: ${{ inputs.concurrency_group }}
          CALLER_LOGIN: ${{ github.actor }}
          TRUSTED_CALLERS: ${{ secrets.CODEX_TARGET_TRUSTED_CALLERS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          sys.path.insert(0, "scripts")
          from codex_target_adapter import admit

          trusted_callers = {
              value.strip()
              for value in os.environ.get("TRUSTED_CALLERS", "").split(",")
              if value.strip()
          }
          payload = admit(
              os.environ.get("EXECUTION_INPUT_JSON", ""),
              os.environ.get("CONCURRENCY_GROUP", ""),
              os.environ.get("CALLER_LOGIN", ""),
              trusted_callers,
          )
          source_issue = payload["source_issue"]
          if re.fullmatch(
              r"Young-Consultations/portfolio-tasks#[1-9][0-9]*", source_issue
          ) is None:
              raise SystemExit(
                  "result credential preflight requires the governed portfolio-tasks source issue"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"source_issue={source_issue}\n")
          PY
      - name: Mint bounded result-writer preflight token
        id: result-writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "5100679"
          private-key: ${{ secrets.AI_SDLC_RESULT_WRITER_PRIVATE_KEY }}
          owner: Young-Consultations
          repositories: portfolio-tasks
          permission-issues: write
          permission-contents: write
      - name: Verify result-writer GitHub App identity
        shell: bash
        env:
          APP_SLUG: ${{ steps.result-writer-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ "$APP_SLUG" == "ai-sdlc-result-writer" ]]
      - name: Prove result-delivery prerequisites before Codex
        id: result-preflight
        uses: Young-Consultations/.github/actions/codex-result-credential-preflight@ai-sdlc-v3.1.0
        with:
          result-token: ${{ steps.result-writer-token.outputs.token }}
          source-issue: ${{ steps.result-source.outputs.source_issue }}
          execution-input-json: ${{ inputs.execution_input_json }}
      - name: Prepare Codex workspace sandbox
        shell: bash
        run: |
          set -euo pipefail
          # Restore the runner prerequisites supplied by the former codex-action.
          userns="$(sysctl -n kernel.unprivileged_userns_clone)"
          if [[ "$userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          if [[ "$apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          [[ "$(sysctl -n kernel.unprivileged_userns_clone)" == "1" ]]
          [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" == "0" ]]
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.154.0
      - id: execute
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
          CONCURRENCY_GROUP: ${{ inputs.concurrency_group }}
          CALLER_LOGIN: ${{ github.actor }}
          TRUSTED_CALLERS: ${{ secrets.CODEX_TARGET_TRUSTED_CALLERS }}
          PRIOR_RESULT_EFFECT: ${{ steps.result-preflight.outputs.prior-effect-class }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_PUBLICATION_TOKEN: ${{ secrets.TARGET_PUBLICATION_TOKEN }}
          # Workflow permissions are contents:read only; this token is NOT a publisher.
          CONTENT_READ_TOKEN: ${{ github.token }}
          AUTHORIZED_EXECUTOR_SHA: ${{ steps.executor-binding.outputs.executor_sha }}
        # Replace the runner shell so the adapter can re-exec with a
        # secret-free environment and leave no secret-bearing ancestor.
        run: exec python3 scripts/codex_target_adapter.py
      - name: Enforce canonical execution outcome
        env:
          EXECUTION_RESULT_JSON: ${{ steps.execute.outputs.execution_result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          result = json.loads(os.environ["EXECUTION_RESULT_JSON"])
          if result["execution_status"] not in {"verified", "draft-pr-created", "duplicate-reused"}:
              raise SystemExit("Target execution did not meet its admitted outcome; see canonical result")
          PY

  report:
    needs: execute
    if: ${{ always() && needs.execute.outputs.execution_result != '' && needs.execute.outputs.source_issue != '' }}
    permissions:
      contents: read
    # 3.0.3 candidate: release publication and control-plane binding are separate gates.
    uses: Young-Consultations/.github/.github/workflows/codex-result-receiver.yml@ai-sdlc-v3.1.0
    with:
      execution_result: ${{ needs.execute.outputs.execution_result }}
      source_issue: ${{ needs.execute.outputs.source_issue }}
    secrets:
      RESULT_WRITER_PRIVATE_KEY: ${{ secrets.AI_SDLC_RESULT_WRITER_PRIVATE_KEY }}
