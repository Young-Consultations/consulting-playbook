name: Execute approved Codex task

on:
  workflow_dispatch:
    inputs:
      execution_input:
        description: Canonical ai-sdlc-contract/v1 execution-input JSON
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TASKS_TOKEN }}
      EXECUTION_INPUT: ${{ inputs.execution_input }}
      RESULT_FILE: ${{ runner.temp }}/execution-result.json
    steps:
      - name: Check out consulting-playbook
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The schemas are owned by portfolio-tasks.  This repository deliberately
      # consumes them rather than carrying a subtly different local copy.
      - name: Check out canonical execution contract
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: Young-Consultations/portfolio-tasks
          token: ${{ secrets.PORTFOLIO_TASKS_TOKEN }}
          path: _execution-contract
          persist-credentials: false
          sparse-checkout: |
            schemas
            .github/schemas

      - name: Locate canonical schemas
        id: schemas
        shell: bash
        run: |
          set -euo pipefail
          input_schema="$(find _execution-contract -type f -iname '*execution-input*.schema.json' -print -quit)"
          result_schema="$(find _execution-contract -type f -iname '*execution-result*.schema.json' -print -quit)"
          test -n "$input_schema" && test -n "$result_schema" || {
            echo '::error::Canonical execution schemas were not found.'; exit 1;
          }
          echo "input=$input_schema" >> "$GITHUB_OUTPUT"
          echo "result=$result_schema" >> "$GITHUB_OUTPUT"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.23.0

      - name: Validate canonical input
        id: contract
        shell: bash
        env:
          INPUT_SCHEMA: ${{ steps.schemas.outputs.input }}
        run: |
          set -euo pipefail
          python scripts/execution_contract.py validate-input \
            --schema "$INPUT_SCHEMA" --json "$EXECUTION_INPUT" \
            --expected-repository Young-Consultations/consulting-playbook \
            --github-output "$GITHUB_OUTPUT"

      - name: Remove contract checkout from worktree
        run: rm -rf _execution-contract

      - name: Confirm source issue remains approved
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.contract.outputs.source_repository }}
          SOURCE_ISSUE_NUMBER: ${{ steps.contract.outputs.source_issue_number }}
        run: |
          set -euo pipefail
          test -n "${PORTFOLIO_TOKEN:-}" || { echo '::error::Portfolio token is unavailable.'; exit 1; }
          response="$(GH_TOKEN="$PORTFOLIO_TOKEN" gh api "/repos/$SOURCE_REPOSITORY/issues/$SOURCE_ISSUE_NUMBER")"
          jq -e '.state == "open" and (has("pull_request") | not)' >/dev/null <<<"$response" || {
            echo '::error::Source issue is not an open issue.'; exit 1;
          }
          jq -e '[.labels[].name] | index("status:approved") != null' >/dev/null <<<"$response" || {
            echo '::error::Source issue is no longer approved.'; exit 1;
          }
          jq -e '[.labels[].name] | index("executor:codex") != null' >/dev/null <<<"$response" || {
            echo '::error::Source issue is no longer assigned to Codex.'; exit 1;
          }
          jq -r '{title, body: (.body // "")} | @json' <<<"$response" > "$RUNNER_TEMP/source-issue.json"

      - name: Create one task branch
        env:
          BRANCH: ${{ steps.contract.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"

      - name: Run Codex through controlled wrapper
        id: codex
        uses: ./.github/actions/run-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          execution-input: ${{ inputs.execution_input }}
          source-issue-file: ${{ runner.temp }}/source-issue.json

      - name: Validate repository changes
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain | grep -q . || { echo '::error::Codex made no changes after one retry.'; exit 1; }
          git diff --check
          python scripts/validate_repository.py
          echo 'validation=passed' >> "$GITHUB_OUTPUT"

      - name: Run repository tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_codex_execute_contract.py
          echo 'tests=passed' >> "$GITHUB_OUTPUT"

      - name: Commit and push once
        env:
          BRANCH: ${{ steps.contract.outputs.branch }}
        run: |
          set -euo pipefail
          git add --all
          git commit -m "Codex: ${{ steps.contract.outputs.project_component }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Create one draft pull request
        id: pr
        env:
          BRANCH: ${{ steps.contract.outputs.branch }}
        run: |
          set -euo pipefail
          url="$(gh pr create --base main --head "$BRANCH" --draft \
            --title "Consulting: ${{ steps.contract.outputs.project_component }}" \
            --body "Automated implementation of ${{ steps.contract.outputs.source_issue }}. Human review is required; no automatic merge is enabled.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build canonical success result
        if: success()
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          BRANCH: ${{ steps.contract.outputs.branch }}
        run: python scripts/execution_contract.py build-result --input "$EXECUTION_INPUT" --out "$RESULT_FILE" --status success --branch "$BRANCH" --pull-request-url "$PR_URL" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Build canonical failure result
        if: failure()
        run: python scripts/execution_contract.py build-result --input "$EXECUTION_INPUT" --out "$RESULT_FILE" --status failure --failure-category execution_failed --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate canonical result
        if: always()
        env:
          RESULT_SCHEMA: ${{ steps.schemas.outputs.result }}
        run: python scripts/execution_contract.py validate-result --schema "$RESULT_SCHEMA" --file "$RESULT_FILE"

      - name: Upload canonical execution result
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: execution-result
          path: ${{ runner.temp }}/execution-result.json
          if-no-files-found: error

      - name: Post result to source issue
        if: always()
        env:
          SOURCE_REPOSITORY: ${{ steps.contract.outputs.source_repository }}
          SOURCE_ISSUE_NUMBER: ${{ steps.contract.outputs.source_issue_number }}
        run: |
          set -euo pipefail
          test -s "$RESULT_FILE"
          body="### Codex execution result

          \`$(jq -r '.status' "$RESULT_FILE")\` — [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Result contract: \`ai-sdlc-contract/v1\`. Human review is required."
          GH_TOKEN="$PORTFOLIO_TOKEN" gh api --method POST "/repos/$SOURCE_REPOSITORY/issues/$SOURCE_ISSUE_NUMBER/comments" -f body="$body"
