name: Validate consulting-playbook target availability

on:
  workflow_call:
    inputs:
      execution_input_json:
        description: Complete canonical execution-input/v2 JSON string
        required: true
        type: string
      concurrency_group:
        description: Router-provided transport concurrency value
        required: true
        type: string
    secrets:
      CODEX_RESULT_TOKEN:
        required: true

concurrency:
  # This transport control is not authorization or an idempotency identity.
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  registry-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject routing while the canonical registry entry is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo '::error::Young-Consultations/consulting-playbook is disabled in organization compatibility release 2.2.0 (f2491872976a4dcc1633997954c03c07cbc4fced).'
          echo '::error::No request validation, Codex execution, repository mutation, publication, or result delivery was attempted.'
          exit 1
