name: V5.6 read-only publisher credential audit

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact independently reviewed merged main SHA
        required: true
        type: string
      confirmation:
        description: Enter audit-publisher-read-only after separate owner authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v5-publisher-credential-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.repository == 'Young-Consultations/consulting-playbook' && github.ref == 'refs/heads/main' && github.actor == 'mightyjoe909' && github.triggering_actor == 'mightyjoe909' && github.run_attempt == 1 && github.sha == inputs.expected_main_sha && github.workflow_sha == inputs.expected_main_sha && inputs.confirmation == 'audit-publisher-read-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout before supplying the credential
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
      - name: Verify publisher identity and reported permission using GET only
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_PUBLICATION_TOKEN: ${{ secrets.TARGET_PUBLICATION_TOKEN }}
        run: exec python3 -I scripts/publisher_credential_audit.py
